<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shift-Reduce Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shift-Reduce Parser</h1>
  <h2>By: Tyler Jackson</h2>

  <div class="container">
    <!-- 1) Parser table -->
    <div>
      <table id="parser">
        <caption>Parser Table</caption>
        <thead>
          <tr>
            <th rowspan="2">State</th>
            <th colspan="6">Action</th>
            <th colspan="3">Goto</th>
          </tr>
          <tr>
            <th>id</th><th>+</th><th>*</th><th>(</th><th>)</th><th>$</th>
            <th>E</th><th>T</th><th>F</th>
          </tr>
        </thead>
        <tbody>
          <tr><th>0</th><td>S5</td><td></td><td></td><td>S4</td><td></td><td></td><td>1</td><td>2</td><td>3</td></tr>
          <tr><th>1</th><td></td><td>S6</td><td></td><td></td><td></td><td>acc</td><td></td><td></td><td></td></tr>
          <tr><th>2</th><td></td><td>R2</td><td>S7</td><td></td><td>R2</td><td>R2</td><td></td><td></td><td></td></tr>
          <tr><th>3</th><td></td><td>R4</td><td>R4</td><td></td><td>R4</td><td>R4</td><td></td><td></td><td></td></tr>
          <tr><th>4</th><td>S5</td><td></td><td></td><td>S4</td><td></td><td></td><td>8</td><td>2</td><td>3</td></tr>
          <tr><th>5</th><td></td><td>R6</td><td>R6</td><td></td><td>R6</td><td>R6</td><td></td><td></td><td></td></tr>
          <tr><th>6</th><td>S5</td><td></td><td></td><td>S4</td><td></td><td></td><td></td><td>9</td><td>3</td></tr>
          <tr><th>7</th><td>S5</td><td></td><td></td><td>S4</td><td></td><td></td><td></td><td></td><td>10</td></tr>
          <tr><th>8</th><td></td><td>S6</td><td></td><td></td><td>S11</td><td></td><td></td><td></td><td></td></tr>
          <tr><th>9</th><td></td><td>R1</td><td>S7</td><td></td><td>R1</td><td>R1</td><td></td><td></td><td></td></tr>
          <tr><th>10</th><td></td><td>R3</td><td>R3</td><td></td><td>R3</td><td>R3</td><td></td><td></td><td></td></tr>
          <tr><th>11</th><td></td><td>R5</td><td>R5</td><td></td><td>R5</td><td>R5</td><td></td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>

    <!-- 2) Grammar + controls -->
    <div>
      <div class="grammarBox">
        <p>
          1. E → E + T<br>
          2. E → T<br>
          3. T → T * F<br>
          4. T → F<br>
          5. F → ( E )<br>
          6. F → id
        </p>
      </div>
      <div class="controls">
        <input id="expression" type="text" placeholder="Enter tokens ending with $">
        <div class="buttons">
          <button id="step">Step</button>
          <button id="run">Run</button>
          <button id="reset">Reset</button>
        </div>
      </div>
    </div>

    <!-- 3) Output -->
    <div>
      <table id="output">
        <caption>Output</caption>
        <thead>
          <tr><th>Stack</th><th>Input</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="parser.js"></script>
</body>
</html>
